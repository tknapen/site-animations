schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_create_storyboard
  kind: create_storyboard
  created_at: '2026-11-13T20:00:00+00:00'
  author: agent:claude
  summary: 'Storyboard: one scene; three slow candidates, 36 fast, the best grid point, refinement, then the simulated
    connective field for comparison.'
  rationale: Proposed in the website review of 13 November 2026 and approved by the site's owner 
    (references/brief.md).
  based_on_revision: working
  in_response_to: []
  uncertainties: []
  claims:
    - statement: A connective field model predicts a target voxel's time course as the Gaussian-weighted sum 
        of the time courses on a source surface, with a centre on that surface and a size.
      source_id: sources_note
      locator: Haak et al. (2013); prfmodel GaussianCFModel
      basis: source
    - statement: With V1 as the source, the target inherits the visual field position of the connective 
        field's centre.
      source_id: sources_note
      locator: Knapen (2021); the site's page on computational models, 'From brain to brain'
      basis: source
    - statement: In this simulation the best grid point has R squared 0.81 and the refined fit 0.83, at the 
        simulated centre voxel (eccentricity 3.1 deg, polar angle 34.8 deg) with size 1.7 voxels.
      source_id: candidates
      locator: data/candidates.csv, seq 39 and 41; data/parameters.json
      basis: source
  targets:
    - file: storyboard.yaml
      document:
        schema_version: '1.0'
        project_id: connective_field
        based_on_animation_revision: working
        scenes:
          - id: fit
            start_seconds: 0
            end_seconds: 15
            purpose: A patch on V1 tries positions and sizes until its weighted sum follows the target voxel; 
              the target inherits the patch's place in the visual field.
            patterns: []
            objects:
              - id: views
                kind: custom
                style_role: primary_signal
                data:
                  source: controls
                  encoding:
                    x: step
                    y: result
                  transforms:
                    - op: scale
                      column: step
                      by:
                        parameter: step
                        default: 0
                    - op: scale
                      column: refine
                      by:
                        parameter: refine
                        default: 0
                    - op: scale
                      column: result
                      by:
                        parameter: result
                        default: 0
                params:
                  builder: cf_fit:build
                  arguments: {}
            actions:
              - id: candidate_1
                kind: vary_parameter
                target: views
                parameter: step
                to: 1
                at_seconds: 1.4
                duration_seconds: 0.9
                show_value: false
              - id: candidate_2
                kind: vary_parameter
                target: views
                parameter: step
                to: 2
                at_seconds: 2.8
                duration_seconds: 0.9
                show_value: false
              - id: fast_grid
                kind: vary_parameter
                target: views
                parameter: step
                to: 38
                at_seconds: 4.2
                duration_seconds: 3.6
                show_value: false
                easing: linear
              - id: grid_best
                kind: vary_parameter
                target: views
                parameter: step
                to: 39
                at_seconds: 7.9
                duration_seconds: 0.8
                show_value: false
              - id: to_refinement
                kind: vary_parameter
                target: views
                parameter: refine
                to: 1
                at_seconds: 9.2
                duration_seconds: 0.5
                show_value: false
              - id: refine_steps
                kind: vary_parameter
                target: views
                parameter: step
                to: 41
                at_seconds: 9.8
                duration_seconds: 1.8
                show_value: false
              - id: show_simulated
                kind: vary_parameter
                target: views
                parameter: result
                to: 1
                at_seconds: 12.2
                duration_seconds: 0.5
                show_value: false
            snapshots:
              - id: first_candidate
                at_seconds: 1.2
                description: "Candidate 0: a large patch low on the sheet, R squared 0.00, a prediction that does
                  not follow the target; heading 'grid search'."
              - id: fast_grid
                at_seconds: 6.0
                description: 'In the fast phase: the patch somewhere on the sheet, the best so far as a thin dashed
                  ring.'
              - id: grid_best
                at_seconds: 8.9
                description: "The best grid point: size 2.0 voxels, R squared 0.81; the prediction follows the target's
                  peaks."
              - id: result
                at_seconds: 14.0
                description: 'After refinement: size 1.7 voxels, R squared 0.83, eccentricity 3.1 deg, polar angle
                  +35 deg; the simulated connective field (2.0 voxels) as a dashed ring around the same centre,
                  with its label.'
  touches_science: true
applied_at: '2026-11-13T19:16:00+00:00'
applied_to_revision: working
