schema_version: '1.0'
id: divisive_normalization
title: 'Divisive normalization: one computation, two response signatures'
sources:
  - id: aqil2021
    type: markdown
    path: references/aqil2021.md
    role: scientific_reference
    citation: Aqil M, Knapen T, Dumoulin SO (2021). Divisive normalization unifies disparate response 
      signatures throughout the human visual hierarchy. PNAS 118(46), e2108713118. doi:10.1073/pnas.2108713118
output:
  duration_seconds: 20
  width_px: 1920
  height_px: 960
  aspect_ratio: 2:1
  fps: 30
  container: mp4
  video_codec: h264
  audio: none
style:
  name: knapen_site
  version: 0.1.0
  overrides: {}
equations:
  - id: dn_model
    typst: r = (a thin G_1 dot.op S + b) / (c thin G_2 dot.op S + d) - b / d
    latex: r = \frac{a\,G_1 \cdot S + b}{c\,G_2 \cdot S + d} - \frac{b}{d}
    symbols:
      r:
        meaning: predicted neural response
      S:
        meaning: the stimulus
      G_1:
        meaning: activation pRF, a Gaussian of size sigma_1
      G_2:
        meaning: normalization pRF, a Gaussian of size sigma_2 at the same position
      a:
        meaning: activation amplitude
      b:
        meaning: activation constant
      c:
        meaning: normalization amplitude
      d:
        meaning: normalization constant
audience: graduate_neuroscience
objective: 'Show that the divisive normalization pRF model produces two response signatures with one computation:
  raising the activation constant b brings out a suppressive surround in the pRF profile, and lowering the normalization
  constant d makes the response function compressive.'
scientific_constraints:
  - id: equation_as_published
    kind: hard
    equation: dn_model
    text: 'Show the model equation as published: activation over normalization, minus b/d.'
  - id: b_suppression
    kind: hard
    equation: dn_model
    text: With b = 0 the pRF profile has no negative surround; raising b produces one. Other parameters stay 
      fixed while b moves.
  - id: d_compression
    kind: hard
    equation: dn_model
    text: Lowering d makes the response function more compressive; a high d gives a nearly linear response. 
      Other parameters stay fixed while d moves.
  - id: simulation_label
    kind: hard
    text: Label the curves as simulations of the equation with illustrative parameter values, not as data.
  - id: fixed_axes
    kind: hard
    text: Keep both axes fixed while a parameter varies.
timeline:
  - id: profile
    at_seconds: 0
    tolerance_seconds: 0
    kind: hard
    instruction: The pRF profile with the equation.
  - id: response
    at_seconds: 10.5
    tolerance_seconds: 1
    kind: preferred
    instruction: The response function with the equation.
direction:
  tone: Minimal, precise, scientific
  avoid:
    - Decorative flourishes
    - Unlabeled axes
    - Title cards
extensions: {}
