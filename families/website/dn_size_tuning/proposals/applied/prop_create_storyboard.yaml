schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_create_storyboard
  kind: create_storyboard
  created_at: '2026-11-13T13:00:00+00:00'
  author: agent:claude
  summary: 'Storyboard: one scene; the disc grows in 6 s, then d sweeps 0.25 to 1 and back, then sigma_2/sigma_1
    sweeps 4 to 1 and back.'
  rationale: The author asked for the DN clips in the form of his reference clips, with both pools drawn on 
    the pRF and prfmodel as the simulation engine (references/brief.md).
  based_on_revision: working
  in_response_to: []
  uncertainties:
    - "Parameter values are illustrative, not fitted: pRF centre (1.5, 1.0) deg, sigma_1 = 1 deg, sigma_2 = 4 deg,
      a = 0.6, b = 0.05, c = 1, d = 0.25, aperture radius 8 deg. They were inferred from the author's two reference
      clips (dn-sweep.mp4, dn-disc.mp4), except the pRF centre, which was moved so the largest disc stays inside
      the aperture."
    - prfmodel's stimulus encoder sums pRF times design over the grid without the cell area; the simulation 
      multiplies the design (each cell's fraction inside the stimulus) by the cell area so that G.S is the 
      integral of a volume-normalized Gaussian over the stimulus. The author should confirm this is the 
      intended convention.
    - manim8's storyboard contract lets vary_parameter drive a custom object only through a data binding whose
      transforms name parameters. The object therefore binds a table of unit values (data/controls.csv) and 
      scales each column by its parameter. This is a workaround for the missing `parameters` field on 
      `custom`, not a use of data.
    - The plot shows the model output in its own units, not a normalized size-response curve, so changing d or
      the ratio also changes the overall amplitude (peak 1.35 at d = 0.25, 0.48 at d = 1; 0.32 at ratio 1). 
      The paper's Fig. 3 may normalize the curves; the author should say which reading is wanted.
    - The size ratio is varied by changing sigma_2 with sigma_1 fixed at 1 deg. With volume-normalized 
      Gaussians a smaller sigma_2 concentrates the normalization pool, so the denominator rises faster and the
      response becomes smaller overall.
    - The drop annotation is the change from the peak to the 6 deg disc. It is -63% at the reference values, 
      -30% at d = 1 and zero at ratio 1, but it is not monotonic in the ratio between 4 and 3 (-63% and -65%),
      because at ratio 4 the 6 deg disc does not yet fill the normalization pool.
    - The paper describes d as controlling the first nonlinearity of the size-response curve (compression) and
      the size ratio as controlling oversaturation. In this simulation d also changes the relative falloff; 
      the second note says so as an observation of the simulation, which the author should check against the 
      intended message.
  claims:
    - statement: The DN pRF model's predicted response is (a G1.S + b)/(c G2.S + d) - b/d, with activation and
        normalization pRFs as isotropic Gaussians at the same position with sizes sigma_1 and sigma_2.
      source_id: aqil2021
      locator: Materials and Methods, 'pRF Models'; Fig. 1D. The same form is implemented in prfmodel 
        (DivNormPRFModel._combine_responses), which computes the curves.
      basis: source
    - statement: 'The size ratio sigma_2/sigma_1 controls spatial oversaturation of the size-response curve: at
        ratio 1 the response reaches a plateau, and above 1 it falls for large stimuli.'
      source_id: aqil2021
      locator: Results, 'DN Model Constants Modulate Suppression and Compression'; Fig. 3
      basis: source
    - statement: The size-response curve is the response to a circular stimulus of growing radius centred on 
        the pRF.
      source_id: aqil2021
      locator: Materials and Methods, 'PRF Profiles and Response Function'
      basis: source
    - statement: For the illustrative parameters the response to the disc peaks at 1.95 deg (1.35) and is 63% 
        lower at 6 deg; at d = 1 the peak is 0.48 at 2.5 deg and the drop 30%; at ratio 1 the response rises 
        to a plateau of 0.32 without falling.
      source_id: curves
      locator: data/disc_growth.csv
      basis: source
    - statement: A larger d gives a weaker response with less relative falloff, for these parameter values.
      source_id: curves
      locator: data/disc_growth.csv, sweep d
      basis: inference
  targets:
    - file: storyboard.yaml
      document:
        schema_version: '1.0'
        project_id: dn_size_tuning
        based_on_animation_revision: working
        scenes:
          - id: growth
            start_seconds: 0
            end_seconds: 24
            purpose: A disc grows over the pRF; the response peaks and falls; d and the size ratio change how 
              much it falls.
            patterns: []
            objects:
              - id: caption
                kind: text_caption
                style_role: foreground
                params:
                  text: A disc grows over the pRF
                  role: body
                  anchor: top_left
              - id: note_peak
                kind: text_caption
                style_role: secondary_text
                params:
                  text: 'past the peak the response falls: oversaturation'
                  role: caption
                  below: caption
                reveal_at_seconds: 4.0
              - id: note_d
                kind: text_caption
                style_role: secondary_text
                params:
                  text: 'a larger d: a weaker response, less oversaturation'
                  role: caption
                  below: caption
                reveal_at_seconds: 9.8
              - id: note_ratio
                kind: text_caption
                style_role: secondary_text
                params:
                  text: as σ₂ shrinks toward σ₁, the oversaturation vanishes
                  role: caption
                  below: caption
                reveal_at_seconds: 16.4
              - id: views
                kind: custom
                style_role: primary_signal
                data:
                  source: controls
                  encoding:
                    x: position
                    y: annotate
                  transforms:
                    - op: scale
                      column: position
                      by:
                        parameter: position
                        default: 0
                    - op: scale
                      column: d
                      by:
                        parameter: d
                        default: 0.25
                    - op: scale
                      column: ratio
                      by:
                        parameter: ratio
                        default: 4
                    - op: scale
                      column: annotate
                      by:
                        parameter: annotate
                        default: 0
                params:
                  builder: dn_views:build
                  arguments:
                    mode: disc
                    table: data/disc_growth.csv
                    parameters: data/parameters.json
                    x_label: disc radius (deg)
                    y_label: model output (a.u.)
                    x_range:
                      - 0
                      - 6
                      - 1
                    y_range:
                      - 0
                      - 2
                      - 0.5
                    height_fraction: 0.83
                    data_label: simulated with prfmodel, illustrative parameters
              - id: model_equation
                kind: equation_block
                style_role: foreground
                equation:
                  id: dn_model
                  highlight:
                    - d
                params:
                  anchor: top_right
                  scale: 0.78
            actions:
              - id: grow
                kind: vary_parameter
                target: views
                parameter: position
                to: 6
                at_seconds: 1.2
                duration_seconds: 6.0
                show_value: false
                easing: eased_linear
              - id: mark
                kind: vary_parameter
                target: views
                parameter: annotate
                to: 1
                at_seconds: 7.7
                duration_seconds: 0.6
                show_value: false
              - id: hide_note_peak
                kind: fade_object
                target: note_peak
                visible: false
                at_seconds: 9.0
                duration_seconds: 0.5
              - id: raise_d
                kind: vary_parameter
                target: views
                parameter: d
                to: 1.0
                at_seconds: 9.8
                duration_seconds: 2.5
                show_value: false
                lead_in_seconds: 0.9
                emphasize:
                  - model_equation
              - id: lower_d
                kind: vary_parameter
                target: views
                parameter: d
                to: 0.25
                at_seconds: 13.8
                duration_seconds: 1.6
                show_value: false
              - id: hide_note_d
                kind: fade_object
                target: note_d
                visible: false
                at_seconds: 15.6
                duration_seconds: 0.5
              - id: shrink_pool
                kind: vary_parameter
                target: views
                parameter: ratio
                to: 1.0
                at_seconds: 16.4
                duration_seconds: 3.0
                show_value: false
              - id: grow_pool
                kind: vary_parameter
                target: views
                parameter: ratio
                to: 4.0
                at_seconds: 20.6
                duration_seconds: 2.4
                show_value: false
            snapshots:
              - id: start
                at_seconds: 1.0
                description: The field with the pRF wash, the solid sigma_1 circle and the dashed sigma_2 
                  circle four times larger; empty axes with the legend; readouts d = 0.25 and sigma_2/sigma_1 
                  = 4.0 under the field.
              - id: grown
                at_seconds: 8.6
                description: The disc at 6 deg; the response peaks near 2 deg and falls; a marker on the peak 
                  and the annotation of the drop by 6 deg; the first note.
              - id: d_high
                at_seconds: 13.5
                description: d = 1.00 in the emphasis ink; the denominator is shifted up, the response is 
                  lower and flatter than the grey reference curve; the second note.
              - id: ratio_one
                at_seconds: 19.9
                description: 'sigma_2/sigma_1 = 1.0: the dashed circle coincides with the solid one; the response
                  rises to a plateau and the annotation reports no drop; the third note.'
              - id: end
                at_seconds: 23.5
                description: 'Back at the reference values: the dashed circle four times the solid one, the response
                  peaked with the drop annotation.'
  touches_science: true
applied_at: '2026-11-13T11:53:51+00:00'
applied_to_revision: working
