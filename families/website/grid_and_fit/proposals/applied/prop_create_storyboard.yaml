scientific_review_required: true
validation_warnings:
  - "action 'fast_grid' moves at constant speed from its first frame to its last (easing: linear); the style asks
    for slow in, slow out: omit `easing` to use `smooth`, or keep linear only for a motion that should read as mechanical"
  - "action 'refine_steps' moves at constant speed from its first frame to its last (easing: linear); the style
    asks for slow in, slow out: omit `easing` to use `smooth`, or keep linear only for a motion that should read
    as mechanical"
  - "action 'grid_best' moves 'views' 0.00s after 'fast_grid' has finished; the style asks for a rest of 0.5s so
    the end state is seen before it changes again: start it later or lengthen its lead-in"
  - "action 'refine_steps' moves 'views' 0.00s after 'to_refinement' has finished; the style asks for a rest of
    0.5s so the end state is seen before it changes again: start it later or lengthen its lead-in"
  - "action 'show_result' moves 'views' 0.45s after 'refine_steps' has finished; the style asks for a rest of 0.5s
    so the end state is seen before it changes again: start it later or lengthen its lead-in"
