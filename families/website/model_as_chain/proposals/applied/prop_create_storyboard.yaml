schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_create_storyboard
  kind: create_storyboard
  created_at: '2026-11-13T15:00:00+00:00'
  author: agent:claude
  summary: 'Storyboard: one scene; the loop, its shrinking, the opening of the model box into seven stages, the
    θ tags, the pulse, the prediction.'
  rationale: The owner supplied this clip as a project seed (animation.yaml, data, references) to be rebuilt 
    as a manim8 project and rendered under the site's light and dark styles.
  based_on_revision: working
  in_response_to: []
  uncertainties:
    - Every beat starts 0.4 to 0.6 s later than in the original scene, because the clip begins with manim8's 
      reveal of the whole picture; all beats stay within the tolerances of the seed's timeline.
    - In the original the prediction in the BOLD box was visible from the moment the box appeared and was 
      removed when the pulse started, to be redrawn at the end. Here the BOLD box shows the data alone until 
      the prediction is drawn.
    - The θ tags come down from the loop's parameter box by moving and growing; the original morphed a copy of
      the box into the four tags.
  claims:
    - statement: "The prediction and the data in the loop's panel and in the BOLD box are synthetic: the Gaussian
        pRF voxel's predicted BOLD for the first 150 s of the bar run, normalised to a peak of 1, and the same plus
        Gaussian noise."
      source_id: panel
      locator: citation of the source
      basis: source
  targets:
    - file: storyboard.yaml
      document:
        schema_version: '1.0'
        project_id: model_as_chain
        based_on_animation_revision: working
        scenes:
          - id: chain
            start_seconds: 0
            end_seconds: 15.5
            purpose: The model box of the modelling loop opens into a chain of stages, four of which carry 
              fitted parameters.
            patterns: []
            objects:
              - id: views
                kind: custom
                style_role: primary_signal
                data:
                  source: controls
                  encoding:
                    x: travel
                    y: prediction
                  transforms:
                    - op: scale
                      column: travel
                      by:
                        parameter: travel
                        default: 0
                    - op: scale
                      column: drop
                      by:
                        parameter: drop
                        default: 0
                    - op: scale
                      column: shrink
                      by:
                        parameter: shrink
                        default: 0
                    - op: scale
                      column: open
                      by:
                        parameter: open
                        default: 0
                    - op: scale
                      column: boxes
                      by:
                        parameter: boxes
                        default: 0
                    - op: scale
                      column: links
                      by:
                        parameter: links
                        default: 0
                    - op: scale
                      column: tags
                      by:
                        parameter: tags
                        default: 0
                    - op: scale
                      column: stems
                      by:
                        parameter: stems
                        default: 0
                    - op: scale
                      column: pulse
                      by:
                        parameter: pulse
                        default: 0
                    - op: scale
                      column: prediction
                      by:
                        parameter: prediction
                        default: 0
                params:
                  builder: model_chain:build
                  arguments: {}
            actions:
              - id: dots_travel
                kind: vary_parameter
                target: views
                parameter: travel
                to: 1
                at_seconds: 1.0
                duration_seconds: 0.8
                show_value: false
              - id: dot_drops
                kind: vary_parameter
                target: views
                parameter: drop
                to: 1
                at_seconds: 1.8
                duration_seconds: 0.6
                show_value: false
              - id: loop_shrinks
                kind: vary_parameter
                target: views
                parameter: shrink
                to: 1
                at_seconds: 3.0
                duration_seconds: 1.3
                show_value: false
              - id: box_opens
                kind: vary_parameter
                target: views
                parameter: open
                to: 1
                at_seconds: 4.3
                duration_seconds: 1.0
                show_value: false
              - id: boxes_appear
                kind: vary_parameter
                target: views
                parameter: boxes
                to: 1
                at_seconds: 5.3
                duration_seconds: 1.5
                show_value: false
                easing: linear
              - id: links_grow
                kind: vary_parameter
                target: views
                parameter: links
                to: 1
                at_seconds: 6.8
                duration_seconds: 0.9
                show_value: false
                easing: linear
              - id: tags_drop
                kind: vary_parameter
                target: views
                parameter: tags
                to: 1
                at_seconds: 7.7
                duration_seconds: 1.0
                show_value: false
              - id: stems_join
                kind: vary_parameter
                target: views
                parameter: stems
                to: 1
                at_seconds: 8.7
                duration_seconds: 0.4
                show_value: false
              - id: pulse_runs
                kind: vary_parameter
                target: views
                parameter: pulse
                to: 1
                at_seconds: 9.6
                duration_seconds: 3.2
                show_value: false
                easing: linear
              - id: prediction_drawn
                kind: vary_parameter
                target: views
                parameter: prediction
                to: 1
                at_seconds: 12.8
                duration_seconds: 1.2
                show_value: false
            snapshots:
              - id: loop
                at_seconds: 0.95
                description: "The loop at full size: 'parameters θ' and 'stimulus' above 'model' with a gear, arrows
                  into it, the panel with the prediction on the data below."
              - id: travel
                at_seconds: 1.4
                description: Two dots halfway along the curved arrows, the gear partly turned.
              - id: opened
                at_seconds: 6.9
                description: The loop small at the top with a heavier model box; the funnel down to the dashed
                  outline; all seven boxes with their glyphs and labels.
              - id: tagged
                at_seconds: 9.3
                description: Arrows between the boxes; θ tags joined to pooling, transformation, neural 
                  dynamics and HRF.
              - id: pulse
                at_seconds: 11.2
                description: The pulse halfway along the row; the stage it is in is darker.
              - id: end
                at_seconds: 15.0
                description: The prediction drawn over the data in the BOLD box; no pulse; every stage at its 
                  resting fill.
  touches_science: true
applied_at: '2026-11-13T14:00:29+00:00'
applied_to_revision: working
