schema_version: '1.0'
id: prop_create_storyboard
kind: create_storyboard
created_at: '2026-11-13T15:00:00+00:00'
author: agent:claude
rationale: The owner supplied this clip as a project seed (animation.yaml, data, references) to be rebuilt as a manim8 project
  and rendered under the site's light and dark styles.
based_on_revision: working
in_response_to: []
summary: 'Storyboard: one scene; the loop, its shrinking, the opening of the model box into seven stages, the θ tags, the
  pulse, the prediction.'
uncertainties:
- Every beat starts 0.4 to 0.6 s later than in the original scene, because the clip begins with manim8's reveal of the whole
  picture; all beats stay within the tolerances of the seed's timeline.
- In the original the prediction in the BOLD box was visible from the moment the box appeared and was removed when the pulse
  started, to be redrawn at the end. Here the BOLD box shows the data alone until the prediction is drawn.
- The θ tags come down from the loop's parameter box by moving and growing; the original morphed a copy of the box into the
  four tags.
claims:
- statement: 'The prediction and the data in the loop''s panel and in the BOLD box are synthetic: the Gaussian pRF voxel''s
    predicted BOLD for the first 150 s of the bar run, normalised to a peak of 1, and the same plus Gaussian noise.'
  source_id: panel
  locator: citation of the source
  basis: source
touches_science: true
targets:
- file: storyboard.yaml
