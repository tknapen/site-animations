schema_version: '1.0'
project_id: model_as_chain
based_on_animation_revision: working
scenes:
  - id: chain
    start_seconds: 0
    end_seconds: 15.5
    purpose: The model box of the modelling loop opens into a chain of stages, four of which carry fitted 
      parameters.
    patterns: []
    objects:
      - id: views
        kind: custom
        style_role: primary_signal
        data:
          source: controls
          encoding:
            x: travel
            y: prediction
          transforms:
            - op: scale
              column: travel
              by:
                parameter: travel
                default: 0
            - op: scale
              column: drop
              by:
                parameter: drop
                default: 0
            - op: scale
              column: shrink
              by:
                parameter: shrink
                default: 0
            - op: scale
              column: open
              by:
                parameter: open
                default: 0
            - op: scale
              column: boxes
              by:
                parameter: boxes
                default: 0
            - op: scale
              column: links
              by:
                parameter: links
                default: 0
            - op: scale
              column: tags
              by:
                parameter: tags
                default: 0
            - op: scale
              column: stems
              by:
                parameter: stems
                default: 0
            - op: scale
              column: pulse
              by:
                parameter: pulse
                default: 0
            - op: scale
              column: prediction
              by:
                parameter: prediction
                default: 0
        params:
          builder: model_chain:build
          arguments: {}
    actions:
      - id: dots_travel
        kind: vary_parameter
        target: views
        parameter: travel
        to: 1
        at_seconds: 1.0
        duration_seconds: 0.8
        show_value: false
      - id: dot_drops
        kind: vary_parameter
        target: views
        parameter: drop
        to: 1
        at_seconds: 1.8
        duration_seconds: 0.6
        show_value: false
      - id: loop_shrinks
        kind: vary_parameter
        target: views
        parameter: shrink
        to: 1
        at_seconds: 3.0
        duration_seconds: 1.3
        show_value: false
      - id: box_opens
        kind: vary_parameter
        target: views
        parameter: open
        to: 1
        at_seconds: 4.3
        duration_seconds: 1.0
        show_value: false
      - id: boxes_appear
        kind: vary_parameter
        target: views
        parameter: boxes
        to: 1
        at_seconds: 5.3
        duration_seconds: 1.5
        show_value: false
        easing: linear
      - id: links_grow
        kind: vary_parameter
        target: views
        parameter: links
        to: 1
        at_seconds: 6.8
        duration_seconds: 0.9
        show_value: false
        easing: linear
      - id: tags_drop
        kind: vary_parameter
        target: views
        parameter: tags
        to: 1
        at_seconds: 7.7
        duration_seconds: 1.0
        show_value: false
      - id: stems_join
        kind: vary_parameter
        target: views
        parameter: stems
        to: 1
        at_seconds: 8.7
        duration_seconds: 0.4
        show_value: false
      - id: pulse_runs
        kind: vary_parameter
        target: views
        parameter: pulse
        to: 1
        at_seconds: 9.6
        duration_seconds: 3.2
        show_value: false
        easing: linear
      - id: prediction_drawn
        kind: vary_parameter
        target: views
        parameter: prediction
        to: 1
        at_seconds: 12.8
        duration_seconds: 1.2
        show_value: false
    snapshots:
      - id: loop
        at_seconds: 0.95
        description: "The loop at full size: 'parameters θ' and 'stimulus' above 'model' with a gear, arrows into
          it, the panel with the prediction on the data below."
      - id: travel
        at_seconds: 1.4
        description: Two dots halfway along the curved arrows, the gear partly turned.
      - id: opened
        at_seconds: 6.9
        description: The loop small at the top with a heavier model box; the funnel down to the dashed 
          outline; all seven boxes with their glyphs and labels.
      - id: tagged
        at_seconds: 9.3
        description: Arrows between the boxes; θ tags joined to pooling, transformation, neural dynamics and 
          HRF.
      - id: pulse
        at_seconds: 11.2
        description: The pulse halfway along the row; the stage it is in is darker.
      - id: end
        at_seconds: 15.0
        description: The prediction drawn over the data in the BOLD box; no pulse; every stage at its resting 
          fill.
