scientific_review_required: true
validation_warnings:
  - "action 'play_run' moves at constant speed from its first frame to its last (easing: linear); the style asks
    for slow in, slow out: omit `easing` to use `smooth`, or keep linear only for a motion that should read as mechanical"
  - "action 'cursor_leaves' moves 'views' 0.20s after 'play_run' has finished; the style asks for a rest of 0.5s
    so the end state is seen before it changes again: start it later or lengthen its lead-in"
