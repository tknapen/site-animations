schema_version: '1.0'
proposal:
  schema_version: '1.0'
  id: prop_create_storyboard
  kind: create_storyboard
  created_at: '2026-11-13T15:00:00+00:00'
  author: agent:claude
  summary: 'Storyboard: one scene; the cursor runs through the 300 s run at constant speed in 9.6 s, then fades.'
  rationale: The owner supplied this clip as a project seed (animation.yaml, data, references) to be rebuilt 
    as a manim8 project and rendered under the site's light and dark styles.
  based_on_revision: working
  in_response_to: []
  uncertainties: []
  claims:
    - statement: The neural response is the overlap of the bar aperture with a Gaussian pRF at (2.5, 1.5) deg,
        sigma 1 deg; the BOLD response is that through a two-gamma haemodynamic response. Both are simulated 
        with prfmodel, not measured.
      source_id: run
      locator: data/run.csv; citation of the source
      basis: source
  targets:
    - file: storyboard.yaml
      document:
        schema_version: '1.0'
        project_id: stimulus_to_bold
        based_on_animation_revision: working
        scenes:
          - id: run
            start_seconds: 0
            end_seconds: 12
            purpose: 'One cursor through the run: the bar in the field, the neural trace at once, the BOLD trace
              about 5 s later.'
            patterns: []
            objects:
              - id: views
                kind: custom
                style_role: primary_signal
                data:
                  source: controls
                  encoding:
                    x: t
                    y: cursor
                  transforms:
                    - op: scale
                      column: t
                      by:
                        parameter: t
                        default: 0
                    - op: scale
                      column: cursor
                      by:
                        parameter: cursor
                        default: 1
                params:
                  builder: prf_run:build
                  arguments: {}
            actions:
              - id: play_run
                kind: vary_parameter
                target: views
                parameter: t
                to: 300
                at_seconds: 1.0
                duration_seconds: 9.6
                show_value: false
                easing: linear
              - id: cursor_leaves
                kind: vary_parameter
                target: views
                parameter: cursor
                to: 0
                at_seconds: 10.8
                duration_seconds: 0.4
                show_value: false
            snapshots:
              - id: layout
                at_seconds: 0.95
                description: The field with fixation and the pRF outline; the strip of eight sweep bands with 
                  arrows; empty neural and BOLD panels with axes; the cursor at 0 s.
              - id: first_sweeps
                at_seconds: 3.3
                description: 'The cursor in the first blank: the bar has crossed twice, two neural peaks are drawn,
                  the BOLD trace is in its undershoot.'
              - id: mid_run
                at_seconds: 6.4
                description: The cursor near 170 s with a bar in the field; four neural peaks and the BOLD 
                  peaks that follow them.
              - id: end
                at_seconds: 11.7
                description: Both traces complete over 300 s; the cursor and its dots are gone; no bar in the 
                  field.
  touches_science: true
applied_at: '2026-11-13T13:55:34+00:00'
applied_to_revision: working
